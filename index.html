function rad(

function getCenter(){

    return {

        x:
        width

    return Math.min(

    minutes
){

    return (

        minutes

        190

    )
    *
    SPEED_MULTIPLIER[
        speedMode
    ];

}


function hexToRGBA(
    hex,
    alpha
){

    const r =
    parseInt(
        hex.slice(
            1,
            3
        ),
        16
    );


    const g =
    parseInt(
        hex.slice(
            3,
            5
        ),
        16
    );


    const b =
    parseInt(
        hex.slice(
            5,
            7
        ),
        16
    );


    return (
        `rgba(${r},${g},${b},${alpha})`
    );

}


/* ==================================================
   REGION / WORLD ARRIVAL
================================================== */

function createArrivalTarget(
    angle
){

    const center =
    getCenter();


    const radius =
    24;


    return {

        x:
        center.x
        +
        Math.cos(
            angle
        )
        *
        radius,


        y:
        center.y
        +
        Math.sin(
            angle
        )
        *
        radius

    };

}

        /
        columns
    );


    const stagger =
    (
        row
        %
        2
    )
    *
    spacingX
    *
    .45;


    const wobbleX =
    Math.sin(
        index
        *
        1.7
    )
    *
    1.2;


    const wobbleY =
    Math.cos(
        index
        *
        1.35
    )
    *
    1.2;


    return {

        x:
        center.x
        +
        (
            column
            -
            (
                columns
                -
                1
            )
            /
            2
        )
        *
        spacingX
        +
        stagger
        +
        wobbleX,


        y:
        center.y
        +
        (
            row
            -
            12
        )
        *
        spacingY
        +
        wobbleY

    };

}

function drawOuterCircle(){

    getCenter();

    getOuterRadius();


    ctx.beginPath();


    ctx.arc(

        center.x,

        center.y,

        radius,

/* ==================================================
   LINES
================================================== */

function drawLines(){

    dots.forEach(

        function(
            dot
        ){

            const remaining =
            Math.hypot(

                dot.targetX
                -
                dot.x,

                dot.targetY
                -
                dot.y

            );


            if(
                remaining
                <
                3
            ){

                return;

            }


            ctx.beginPath();


            ctx.moveTo(

                dot.x,

                dot.y

            );


            ctx.lineTo(

                dot.targetX,

                dot.targetY

            );


            if(
                dot.isMe
            ){

                ctx.strokeStyle =
                "rgba(234,74,114,.48)";


                ctx.lineWidth =
                1.1;

            }


            else if(
                mode
                ===
                "korea"
            ){

                ctx.strokeStyle =
                hexToRGBA(

                    dot.color,

                    .055

                );


                ctx.lineWidth =
                .5;

            }


            else{

                ctx.strokeStyle =
                hexToRGBA(

                    dot.color,

                    .20

                );


                ctx.lineWidth =
                .8;

            }


            ctx.stroke();

        }

    );

}


/* ==================================================
   DOT
================================================== */

function drawDot(
    dot
){

    ctx.beginPath();


    ctx.arc(

        dot.x,

        dot.y,

        dot.size,

        0,

        Math.PI
        *
        2

    );


    ctx.fillStyle =
    dot.color;


    ctx.fill();


    const remaining =
    Math.hypot(

        dot.targetX
        -
        dot.x,

        dot.targetY
        -
        dot.y

    );


    /*
    ME는 계속 표시
    */

    if(
        dot.isMe
    ){

        ctx.save();


        ctx.textAlign =
        "center";


        ctx.font =
"600 11px SUIT";


        ctx.fillStyle =
        "#EA4A72";


        ctx.fillText(

            `ME · ${Math.round(dot.minutes)} MIN`,

            dot.x,

            dot.y
            -
            12

        );


        ctx.restore();


        return;

    }


    /*
    REGION / WORLD는
    도착하면 이름 없어짐
    */

    if(
        mode
        !==
        "korea"
        &&
        remaining
        >
        8
    ){

        ctx.save();


        ctx.textAlign =
        "center";


        ctx.font =
"400 9px SUIT";

        ctx.fillStyle =
        "#555";


        ctx.fillText(

            `${dot.name} · ${Math.round(dot.minutes)} MIN`,

            dot.x,

            dot.y
            -
            11

        );


        ctx.restore();

    }

}


/* ==================================================
   ANIMATE
================================================== */

function animate(
    now
){

    ctx.clearRect(

        0,

        0,

        width,

        height

    );


    drawOuterCircle();


    const elapsed =
    now
    -
    startTime;


    dots.forEach(

        function(
            dot
        ){

            const progress =
            Math.min(

                elapsed
                /
                dot.duration,

                1

            );


            dot.x =
            dot.startX
            +
            (
                dot.targetX
                -
                dot.startX
            )
            *
            progress;


            dot.y =
            dot.startY
            +
            (
                dot.targetY
                -
                dot.startY
            )
            *
            progress;

        }

    );


    drawLines();


    dots.forEach(
        drawDot
    );


    requestAnimationFrame(
        animate
    );

}

function calculateLongerPercent(
    minutes
){

    let shorter =
    0;


    COMMUTE_DATA
    .koreaDistribution
    .forEach(

        function(
            bin
        ){

            if(
                minutes
                >=
                bin.max
            ){

                shorter +=
                bin.percent;

            }


            else if(
                minutes
                >
                bin.min
                &&
                minutes
                <
                bin.max
            ){

                shorter +=

                bin.percent
                *
                (
                    (
                        minutes
                        -
                        bin.min
                    )
                    /
                    (
                        bin.max
                        -
                        bin.min
                    )
                );

            }

        }

    );


    return Math.max(

        0,

        100
        -
        shorter

    );

}

function buildAddress(
    place
){

    const roadAddress = [

        place.upperAddrName,

        place.middleAddrName,

        place.roadName,

        place.firstBuildNo

    ]
    .filter(
        Boolean
    )
    .join(
        " "
    )
    .trim();


    const oldAddress = [

        place.upperAddrName,

        place.middleAddrName,

        place.lowerAddrName,

        place.detailAddrName,

        place.firstNo

    ]
    .filter(
        Boolean
    )
    .join(
        " "
    )
    .trim();


    return (
        roadAddress
        ||
        oldAddress
        ||
        place.address
        ||
        ""
    );

}


/* ==================================================
   TMAP PLACE SEARCH

   타자만 치면 바로 실행
   엔터 필요 없음
================================================== */

async function searchTmapPlaces(
    keyword
){

    const params =
    new URLSearchParams({

        version:
        "1",

        searchKeyword:
        keyword,

        searchType:
        "all",

        searchtypCd:
        "A",

        reqCoordType:
        "WGS84GEO",

        resCoordType:
        "WGS84GEO",

        page:
        "1",

        count:
        "8",

        multiPoint:
        "N",

        poiGroupYn:
        "N"

    });


    const response =
    await fetch(

        `https://apis.openapi.sk.com/tmap/pois?${params.toString()}`,

        {

            headers:{

                Accept:
                "application/json",

                appKey:
                TMAP_APP_KEY

            }

        }

    );


    if(
        !response.ok
    ){

        throw new Error(
            `POI ${response.status}`
        );

    }


    const data =
    await response.json();


    return (

        data.searchPoiInfo
        ?.
        pois
        ?.
        poi

        ||

        []

    );

}

                .classList
                .remove(

                );

            }

        }

    );

}

/* ==================================================
   TMAP PUBLIC TRANSIT

   출발지 / 도착지로
   여러 대중교통 경로 검색
================================================== */

async function searchTransitRoutes(

    origin,

    destination

){

    const response =
    await fetch(

        "https://apis.openapi.sk.com/transit/routes",

        {

            method:
            "POST",


            headers:{

                Accept:
                "application/json",

                "Content-Type":
                "application/json",

                appKey:
                TMAP_APP_KEY

            },


            body:
            JSON.stringify({

                startX:
                String(
                    origin.lon
                ),

                startY:
                String(
                    origin.lat
                ),

                endX:
                String(
                    destination.lon
                ),

                endY:
                String(
                    destination.lat
                ),

                count:
                5,

                lang:
                0,

                format:
                "json"

            })

        }

    );


    if(
        !response.ok
    ){

        throw new Error(
            `TRANSIT ${response.status}`
        );

    }


    const data =
    await response.json();


    const itineraries =

    data.metaData
    ?.
    plan
    ?.
    itineraries

    ||

    [];


    if(
        !itineraries.length
    ){

        throw new Error(
            "NO_ROUTE"
        );

    }


    return itineraries.map(

        function(
            itinerary,
            index
        ){


            const legs =
            itinerary.legs
            ||
            [];


            const lines =
            [];


            legs.forEach(

                function(
                    leg
                ){


                    if(
                        leg.mode
                        ===
                        "WALK"
                    ){

                        return;

                    }


                    let label =
                    leg.route
                    ||
                    "";


                    const lanes =
                    leg.Lane
                    ||
                    leg.lane
                    ||
                    [];


                    if(
                        !label
                        &&
                        lanes.length
                    ){

                        label =
                        lanes[0].route
                        ||
                        "";

                    }


                    if(
                        !label
                    ){

                        const modeName = {

                            BUS:
                            "버스",

                            SUBWAY:
                            "지하철",

                            EXPRESSBUS:
                            "고속/시외버스",

                            TRAIN:
                            "기차",

                            AIRPLANE:
                            "항공",

                            FERRY:
                            "해운"

                        };


                        label =
                        modeName[
                            leg.mode
                        ]
                        ||
                        leg.mode;

                    }


                    if(

                        label

                        &&

                        !lines.includes(
                            label
                        )

                    ){

                        lines.push(
                            label
                        );

                    }

                }

            );


            return {

                index,


                minutes:
                Math.max(

                    1,

                    Math.round(

                        (
                            itinerary.totalTime
                            ||
                            0
                        )
                        /
                        60

                    )

                ),


                distance:
                Math.round(

                    (
                        (
                            itinerary.totalDistance
                            ||
                            0
                        )
                        /
                        1000
                    )
                    *
                    10

                )
                /
                10,


                transfers:
                itinerary.transferCount
                ||
                0,


                walkingMinutes:
                Math.round(

                    (
                        itinerary.totalWalkTime
                        ||
                        0
                    )
                    /
                    60

                ),


                fare:
                itinerary.fare
                ?.
                regular
                ?.
                totalFare

                ||

                0,


                lines

            };

        }

    );

}


/* ==================================================
   RENDER ROUTES
================================================== */

function renderRouteChoices(
    routes
){

    routeChoices.innerHTML =
    "";


    routes.forEach(

        function(
            route,
            index
        ){


            const button =
            document.createElement(
                "button"
            );


            button.type =
            "button";


            button.className =
            "routeChoice";


            const routeText =

            route.lines.length

            ?

            route.lines.join(
                " → "
            )

            :

            "대중교통 경로";


            const fareText =

            route.fare

            ?

            route.fare
            .toLocaleString()
            +
            "원"

            :

            "";


            button.innerHTML =
            `

            <span class="routeChoiceTop">

                <strong class="routeChoiceTime">
                    ${route.minutes}분
                </strong>

                <span class="routeChoiceFare">
                    ${fareText}
                </span>

            </span>


            <span class="routeChoiceLines">
                ${routeText}
            </span>


            <span class="routeChoiceMeta">

                경로 ${index + 1}

                ·

                환승 ${route.transfers}회

                ·

                도보 약 ${route.walkingMinutes}분

                ·

                ${route.distance}km

            </span>

            `;


            button.addEventListener(

                "click",

                function(){

                    selectCommuteRoute(

                        route,

                        button

                    );

                }

            );


            routeChoices.appendChild(
                button
            );

        }

    );

}


/* ==================================================
   SELECT ROUTE

   선택한 경로 시간으로
   ME 점 생성
================================================== */

function selectCommuteRoute(

    route,

    button

){

    document
    .querySelectorAll(
        ".routeChoice"
    )
    .forEach(

        function(
            item
        ){

            item
            .classList
            .remove(
                "active"
            );

        }

    );


    button
    .classList
    .add(
        "active"
    );


    myData = {

        name:
        "ME",

        origin:
        selectedOrigin.name,

        destination:
        selectedDestination.name,

        minutes:
        route.minutes,

        distance:
        route.distance,

        isMe:
        true

    };


    const longer =
    calculateLongerPercent(
        route.minutes
    );


    myResult.innerHTML =
    `

    <strong>
        ${selectedOrigin.name}
    </strong>

    →

    <strong>
        ${selectedDestination.name}
    </strong>

    <br>

    선택 경로 ·

    <strong>
        ${route.minutes}분
    </strong>

    ·

    ${route.distance}km

    <br>

    긴 통근시간 기준

    <strong>
        상위 약 ${longer.toFixed(1)}%
    </strong>

    `;


    createVisualization();

}

================================================== */

searchRouteButton.addEventListener(

    "click",

    async function(){


        if(

            !selectedOrigin

            ||

            !selectedDestination

        ){


            myResult.innerHTML =
            "출발지와 도착지를 검색한 뒤<br>목록에서 각각 하나씩 선택해주세요.";


            return;

        }


        if(
            !checkKey()
        ){


            myResult.textContent =
            "코드 맨 위 TMAP_APP_KEY에 발급받은 appKey를 넣어주세요.";


            return;

        }


        searchRouteButton.disabled =
        true;


        searchRouteButton.textContent =
        "SEARCHING...";


        routeChoices.innerHTML =
        "";


        myResult.textContent =
        "대중교통 경로를 찾고 있습니다.";


        try{


            const routes =
            await searchTransitRoutes(

                selectedOrigin,

                selectedDestination

            );


            renderRouteChoices(
                routes
            );


            myResult.textContent =
            "원하는 경로를 선택해주세요.";


        }


        catch(
            error
        ){


            console.error(
                error
            );


            if(
                error.message
                ===
                "NO_ROUTE"
            ){

                myResult.textContent =
                "대중교통 경로가 없습니다.";

            }


            else{

                myResult.textContent =
                "대중교통 경로 검색에 실패했습니다.";

            }

        }


        finally{


            searchRouteButton.disabled =
            false;


            searchRouteButton.textContent =
            "FIND ROUTES";

        }

    }

);
